<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dispatch console mock: quiet responders</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 Arial,sans-serif;color:#1d2530;background:#f3f5f8}
  header{background:#1d2530;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
  header b{font-size:17px}
  .tag{font-size:12px;background:#f0b429;color:#1d2530;padding:2px 8px;border-radius:10px}
  .wrap{display:flex;gap:16px;padding:16px 20px}
  .list{flex:1.1}
  .detail{flex:1;background:#fff;border:1px solid #d6dbe3;border-radius:8px;padding:16px;min-height:420px}
  .banner{background:#fff4e0;border:1px solid #f0b429;border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .banner button{margin-left:10px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #d6dbe3;border-radius:8px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid #eceff3;font-size:14px}
  th{background:#e9edf3;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  tr.row{cursor:pointer} tr.row:hover{background:#f6f9ff} tr.sel{background:#e8f0ff!important}
  .pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:bold}
  .quiet{background:#fde2e0;color:#a4261b} .ok{background:#dff3e4;color:#1b6b34} .busy{background:#e3e9f9;color:#2b4a9a}
  button{font:inherit;padding:7px 12px;border-radius:6px;border:1px solid #1d5fd1;background:#1d5fd1;color:#fff;cursor:pointer}
  button.ghost{background:#fff;color:#1d5fd1}
  button:disabled{opacity:.5;cursor:default}
  h2{margin:0 0 4px;font-size:19px} .sub{color:#5b6674;font-size:13px;margin-bottom:12px}
  .bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin:8px 0 2px}
  .bar{flex:1;background:#8fb0ea;text-align:center;font-size:11px;color:#1d2530;min-height:2px;position:relative}
  .bar.post{background:#e58a82}
  .lbls{display:flex;gap:8px;font-size:11px;color:#5b6674} .lbls span{flex:1;text-align:center}
  .box{background:#f3f5f8;border-radius:6px;padding:10px 12px;margin:12px 0;font-size:14px}
  .done{background:#dff3e4;border:1px solid #9fd5ae}
  .note{font-size:12px;color:#5b6674;margin-top:14px}
  .empty{color:#5b6674;margin-top:60px;text-align:center}
</style>
</head>
<body>
<header><b>Rook Dispatch &middot; Console</b><span class="tag">MOCK &middot; illustrative data, not live</span></header>
<div class="wrap">
  <div class="list">
    <div class="banner" id="banner">
      <span><b id="qcount">4 responders</b> have gone quiet since 12 Aug: pinged far less than usual.</span>
      <span><button class="ghost" id="filterBtn">Show only quiet</button></span>
    </div>
    <table>
      <thead><tr><th>Responder</th><th>Area</th><th>Availability</th><th>Pings / wk</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="detail" id="detail"><div class="empty">Click a responder to see what's happening.</div></div>
</div>

<script>
const R = [
  {n:"Vesper",a:"Old Town",av:"Available",before:"~11",now:"~2",q:true,since:"17 Aug",weeks:[11,11,12,10,3,2],handler:"Dot"},
  {n:"Farlight",a:"Uptown",av:"Available",before:"~12",now:"0",q:true,since:"24 Aug",weeks:[12,12,12,12,6,0],handler:"Linda Pruitt"},
  {n:"The Undertow",a:"(area)",av:"Available",before:"~11",now:"~2",q:true,since:"17 Aug",weeks:[11,12,11,11,4,2],handler:"-"},
  {n:"Meteor Mite",a:"Eastgate",av:"Available",before:"~11",now:"~2",q:true,since:"17 Aug",weeks:[11,11,12,11,3,2],handler:"Kip"},
  {n:"The Gale",a:"Eastgate",av:"Available",before:"~6",now:"~9",q:false,busy:true,weeks:[6,6,7,6,8,9]},
  {n:"Sgt. Falkirk",a:"Uptown",av:"Available",before:"~3",now:"~5",q:false,weeks:[3,3,4,3,4,5]},
  {n:"Captain Vantage",a:"(area)",av:"Available",before:"~5",now:"~6",q:false,weeks:[5,5,5,6,6,6]},
  {n:"Nightwell",a:"Old Town",av:"Away",before:"~4",now:"0",q:false,weeks:[4,4,4,4,0,0]}
];
const WK=["13 Jul","20 Jul","3 Aug","10 Aug","17 Aug","24 Aug"];
let sel=null, onlyQuiet=false, fresh={};

function pill(r){
  if(fresh[r.n]) return '<span class="pill ok">Fresh start queued</span>';
  if(r.q) return '<span class="pill quiet">Gone quiet</span>';
  if(r.busy) return '<span class="pill busy">Busier than usual</span>';
  return '<span class="pill ok">Normal</span>';
}
function renderRows(){
  const tb=document.getElementById('rows'); tb.innerHTML='';
  R.filter(r=>!onlyQuiet||r.q).forEach(r=>{
    const tr=document.createElement('tr'); tr.className='row'+(sel===r.n?' sel':'');
    tr.innerHTML=`<td><b>${r.n}</b></td><td>${r.a}</td><td>${r.av}</td><td>${r.before} &rarr; ${r.now}</td><td>${pill(r)}</td>`;
    tr.onclick=()=>{sel=r.n;renderRows();renderDetail(r)};
    tb.appendChild(tr);
  });
}
function renderDetail(r){
  const d=document.getElementById('detail');
  const max=Math.max(...r.weeks,1);
  const bars=r.weeks.map((v,i)=>`<div class="bar ${i>=4?'post':''}" style="height:${Math.max(v/max*85,2)}px">${v}</div>`).join('');
  const lbls=WK.map(w=>`<span>${w}</span>`).join('');
  let body='';
  if(r.q){
    body=`
      <div class="box"><b>Gone quiet since ${r.since}.</b> Marked <b>${r.av.toLowerCase()}</b>, but not offered callouts. This is a ranking effect, not the responder being away.</div>
      <div class="box">Why: each missed or declined ping lowers their ranking, and nothing raises it back unless they are pinged. A run of missed pings after the wait went from 90 to 60 seconds can leave them stuck.</div>
      ${fresh[r.n]
        ? `<div class="box done"><b>Fresh start queued.</b> Their next few pings won't be judged on the old record. Their handler (${r.handler}) will see how those go in this view.</div>`
        : `<button id="fresh">Give a fresh start</button> <button class="ghost" id="away">Mark away instead</button>
           <div class="note">Fresh start: the next few pings aren't judged on the old record. It doesn't guarantee callouts.</div>`}`;
  } else if(r.busy){
    body=`<div class="box">Taking more than usual since 12 Aug, likely covering for quiet responders in the same area (Eastgate: Meteor Mite).</div>`;
  } else {
    body=`<div class="box">Nothing unusual. Ping volume is steady.</div>`;
  }
  d.innerHTML=`<h2>${r.n}</h2><div class="sub">${r.a} &middot; ${r.av}${r.handler?' &middot; handler: '+r.handler:''}</div>
    <div><b>Pings per week</b> <span class="note">(red = after 4.2 on 12 Aug)</span></div>
    <div class="bars">${bars}</div><div class="lbls">${lbls}</div>${body}
    <div class="note">Mock. Numbers are illustrative: Farlight's ~12/wk before 4.2 and 0 by 24 Aug come from the data; intermediate weeks are invented. Cover names only; no identities.</div>`;
  const f=document.getElementById('fresh');
  if(f) f.onclick=()=>{fresh[r.n]=true;renderRows();renderDetail(r);updateBanner()};
  const a=document.getElementById('away');
  if(a) a.onclick=()=>{r.av='Away';r.q=false;renderRows();renderDetail(r);updateBanner()};
}
function updateBanner(){
  const n=R.filter(r=>r.q&&!fresh[r.n]).length;
  document.getElementById('qcount').textContent=n+(n===1?' responder':' responders');
  document.getElementById('banner').style.display=n?'flex':'none';
}
document.getElementById('filterBtn').onclick=e=>{onlyQuiet=!onlyQuiet;e.target.textContent=onlyQuiet?'Show everyone':'Show only quiet';renderRows()};
renderRows();updateBanner();
</script>
</body>
</html>
